</style></head><body><main>

<script>
const MACH=[0.0444, 0.0888, 0.1777, 0.2665, 0.3553, 0.4441, 0.533, 0.6218, 0.7106, 0.755, 0.7995, 0.8217, 0.8439, 0.8661, 0.8883],CD=[0.4501, 0.382, 0.3431, 0.3273, 0.3278, 0.3352, 0.3439, 0.364, 0.3942, 0.4132, 0.4331, 0.4482, 0.4675, 0.4828, 0.506],AJ={"factor_cd": 0.4532, "mv_referencia_fps": 944, "mv_efectiva_fps": 769.0, "rango_valido_yd": [30, 400]};
const YD=.9144,FPS=.3048,M=38*6.479891e-5,AREA=Math.PI*.0055**2/4,G=9.80665,RA=287.05,RV=461.495,DT=2e-4,SG=1.4,LC=2;
const num=s=>parseFloat(String(s).trim().replace(',','.'));
const fmt=(x,d=1)=>x.toFixed(d).replace('.',',');
function interp(x,xs,ys){if(x<=xs[0])return ys[0];if(x>=xs[xs.length-1])return ys[ys.length-1];let lo=0,hi=xs.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(xs[m]<=x)lo=m;else hi=m}const t=(x-xs[lo])/(xs[hi]-xs[lo]);return ys[lo]+t*(ys[hi]-ys[lo])}
function atm(alt,t,p,hr){const T=t+273.15,P=p?p*100:101325*Math.pow(1-2.25577e-5*alt,5.25588),es=610.94*Math.exp(17.625*t/(t+243.04)),pv=Math.min(Math.max(hr,0),100)/100*es;return{rho:(P-pv)/(RA*T)+pv/(RV*T),a:Math.sqrt(1.4*RA*T/(1-.378*pv/P)),p:P}}
function tray(mv,cero,sh,alt,tc,fcd,w0,pres,hr){
 const at=atm(alt,tc,pres,hr),cds=CD.map(c=>c*fcd),v0=mv*FPS,shm=sh/100,k=.5*at.rho*AREA/M;
 function vol(ang,xmax,w){const[wx,wz]=w;let vx=v0*Math.cos(ang),vy=v0*Math.sin(ang),vz=0,x=0,y=-shm,z=0,t=0,i=0;const X=[x],Y=[y],Z=[z],V=[v0],T=[t];
  const add=()=>{X.push(x);Y.push(y);Z.push(z);V.push(Math.hypot(vx,vy,vz));T.push(t)};
  while(x<xmax){const rx=vx-wx,rz=vz-wz,vr=Math.sqrt(rx*rx+vy*vy+rz*rz);if(vr<15)break;
   const acc=k*vr*interp(vr/at.a,MACH,cds);vx-=acc*rx*DT;vy-=(acc*vy+G)*DT;vz-=acc*rz*DT;x+=vx*DT;y+=vy*DT;z+=vz*DT;t+=DT;if(++i%5===0)add()}
  add();return{X,Y,Z,V,T}}
 const xc=cero*YD;let lo=-.02,hi=.1,ang=0;
 for(let n=0;n<40;n++){ang=(lo+hi)/2;const s=vol(ang,xc+.05,[0,0]);if(interp(xc,s.X,s.Y)>0)hi=ang;else lo=ang}
 const S=vol(ang,450*YD+1,w0);
 return{rho:at.rho,p:at.p,alc:S.X[S.X.length-1],punto(d){const y=interp(d,S.X,S.Y),z=interp(d,S.X,S.Z),v=interp(d,S.X,S.V),t=interp(d,S.X,S.T);
  return{y,v,t,e:.5*M*v*v,moa:Math.atan2(y,d)*10800/Math.PI,lat:Math.atan2(z,d)*10800/Math.PI}}}}
function comp(vel,dir){const w=vel/3.6,th=dir*Math.PI/180;return[-w*Math.cos(th),-w*Math.sin(th)]}
const spin=(t,d,der)=>{const m=Math.atan2(1.25*(SG+1.2)*Math.pow(t,1.83)*.0254,d)*10800/Math.PI;return der?m:-m};
const jump=(wz,der)=>{const m=(.01*SG-.0024*LC+.032)*wz*2.23694;return der?m:-m};
let CA={};
function trays(c,vw){const kb=[c.mv,c.cero,c.sh,c.alt,c.temp,c.pres,c.hr].join('|');
 if(CA.kb!==kb){const mva=c.mv*AJ.mv_efectiva_fps/AJ.mv_referencia_fps;CA={kb,t0:tray(c.mv,c.cero,c.sh,c.alt,c.temp,1,[0,0],c.pres,c.hr),ta:tray(mva,c.cero,c.sh,c.alt,c.temp,AJ.factor_cd,[0,0],c.pres,c.hr),w:{}}}
 const kw=vw+'|'+c.dir;if(!CA.w[kw])CA.w[kw]=vw?tray(c.mv,c.cero,c.sh,c.alt,c.temp,1,comp(vw,c.dir),c.pres,c.hr):CA.t0;
 return{t0:CA.t0,ta:CA.ta,tw:CA.w[kw]}}
function solve(c,vw,dm){const T=trays(c,vw),p0=T.t0.punto(dm),pw=T.tw.punto(dm),pa=T.ta.punto(dm),[wx,wz]=comp(vw,c.dir);
 const dfr=pw.moa-p0.moa,salto=(vw&&!c.gno)?jump(wz,c.gder):0;let lg=0;
 if(!c.gno){const x0=c.cero*YD;lg=spin(p0.t,dm,c.gder)-spin(T.t0.punto(x0).t,x0,c.gder)}
 return{vert:pa.moa+dfr+salto,lat:pw.lat*c.fv+lg,v:p0.v,t:p0.t,e:p0.e}}
const alClick=(m,c)=>c>0?Math.round(Math.abs(m)/c)*c:Math.abs(m);
const ladoCorr=l=>l>0?'IZQUIERDA':'DERECHA';
//UI
const $=id=>document.getElementById(id);
const DEF={dist:'100',unidad:'yd',viento:'0',peak:'0',dir:'90',giro:'Derecha',fv:'1,00',mv:'944',cero:'50',sh:'5,5',alt:'900',temp:'20',clic:'0,25',pres:'',hr:''};
const COLS=["fecha_hora","distancia_yd","vel_salida_fps","cero_yd","altura_mira_cm","click_moa","altitud_m","temp_c","presion_hpa_usada","origen_presion","humedad_pct","densidad_kg_m3","viento_media_kmh","viento_peak_kmh","viento_usado","viento_usado_kmh","viento_desde_deg","giro_canon","factor_viento","elev_pred_moa(+arriba)","elev_pred_dial_moa(+arriba)","elev_real_moa(+arriba)","elev_estado","lat_pred_moa(+derecha)","lat_pred_dial_moa(+derecha)","lat_real_moa(+derecha)","lat_estado","notas"];
let REG=[],U=null;
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
function cfg(){const c={};for(const k in DEF)c[k]=$(k).value;return c}
function readCfg(){const g=k=>{const x=num($(k).value);if(!isFinite(x))throw k;return x},o=(k,lo,hi)=>{const s=$(k).value.trim();if(!s)return null;const x=num(s);if(!(x>=lo&&x<=hi))throw k;return x};
 const gi=$('giro').value;return{mv:g('mv'),cero:g('cero'),sh:g('sh'),alt:g('alt'),temp:g('temp'),clic:g('clic'),viento:g('viento'),peak:g('peak')||0,dir:((g('dir')%360)+360)%360,fv:g('fv'),pres:o('pres',300,1100),hr:o('hr',0,100)||0,gder:gi==='Derecha',gno:gi==='No considerar',giro:gi}}
const latTxt=(l,c)=>{const v=alClick(l,c);return v===0?'0,00 MOA':fmt(v,2)+' MOA '+ladoCorr(l)};
function compute(){
 try{const c=readCfg(),d=num($('dist').value);if(!(d>0))throw 'dist';const dyd=$('unidad').value==='yd'?d:d/YD,dm=dyd*YD,T=trays(c,c.viento);
  if(dm>T.t0.alc){U=null;$('oVert').textContent='–';$('oAviso').textContent='El slug no llega a esa distancia.';updPred();return}
  const r=solve(c,c.viento,dm),rp=c.peak>0?solve(c,c.peak,dm):null;
  $('oVert').textContent=fmt(alClick(r.vert,c.clic),2)+' MOA '+(r.vert<0?'↑':'↓');
  $('oClk').textContent=(c.clic>0?Math.round(Math.abs(r.vert)/c.clic):0)+' clicks · exacto '+fmt(Math.abs(r.vert),2)+' MOA';
  $('oMed').textContent=latTxt(r.lat,c.clic);$('oPeak').textContent=rp?latTxt(rp.lat,c.clic):'–';
  const rr=atm(900,20,null,0).rho;
  $('oInfo').textContent=fmt(r.v/FPS,0)+' fps · '+fmt(r.e,1)+' J · '+fmt(r.t,2)+' s · aire '+fmt(T.t0.rho,3)+' kg/m³ ('+fmt((T.t0.rho/rr-1)*100,1)+'% vs tus disparos)';
  let av='';const[lo,hi]=AJ.rango_valido_yd;
  if(dyd<lo||dyd>hi)av='Fuera del rango de tus disparos ('+lo+'–'+hi+' yd): la caída se extrapola.';
  else if(Math.abs(c.mv-AJ.mv_referencia_fps)>15||Math.abs(T.t0.rho/rr-1)>.08)av='Cambió la velocidad o la densidad del aire respecto de tus disparos: caída aproximada.';
  if((c.viento||c.peak)&&Math.abs(c.fv-1)<1e-9)av+=(av?' ':'')+'Viento sin calibrar (factor 1,00).';
  $('oAviso').textContent=av;U={c,r,rp,dyd,rho:T.t0.rho,p:T.t0.p/100}
 }catch(e){U=null;$('oAviso').textContent='Revisa los datos: deben ser números.'}
 updPred();ls.set('slug217_cfg',cfg())}
function predLat(){if(!U)return null;if($('uso').value==='Peak')return U.rp?[U.rp,U.c.peak,'Peak']:null;return[U.r,U.c.viento,U.c.viento?'Media':'Sin viento']}
function updPred(){if(!U){$('pE').textContent='–';$('pL').textContent='–';return}
 $('pE').textContent=fmt(alClick(U.r.vert,U.c.clic),2)+' MOA '+(U.r.vert<0?'ARRIBA':'ABAJO');const p=predLat();$('pL').textContent=p?latTxt(p[0].lat,U.c.clic):'sin peak'}
function togg(w){const ok=$('ok'+w).checked;$('r'+w).classList.toggle('on',!ok);if(ok||!U)return;
 if(w==='E'){$('vE').value=fmt(alClick(U.r.vert,U.c.clic),2);$('sE').value=U.r.vert<0?'ARRIBA':'ABAJO'}
 else{const p=predLat(),l=p?p[0].lat:0;$('vL').value=fmt(alClick(l,U.c.clic),2);$('sL').value=l>0?'IZQUIERDA':'DERECHA'}}
const sg=(v,pos)=>pos?v:-v;
function guardar(){const msg=$('msg');if(!U){msg.textContent='Completa datos válidos antes de guardar.';return}
 const p=predLat();if(!p){msg.textContent='Elegiste viento Peak pero el peak es 0.';return}
 const c=U.c,[rl,vk,uso]=p,ep=-U.r.vert,lp=-rl.lat,ed=sg(alClick(ep,c.clic),ep>=0),ld=sg(alClick(lp,c.clic),lp>=0);let er,ee,lr,le;
 try{if($('okE').checked){er=ed;ee='OK'}else{const v=num($('vE').value);if(!isFinite(v))throw 0;er=sg(Math.abs(v),$('sE').value==='ARRIBA');ee=Math.abs(er-ed)<1e-9?'OK':'CORREGIDO'}
  if($('okL').checked){lr=ld;le='OK'}else{const v=num($('vL').value);if(!isFinite(v))throw 0;lr=sg(Math.abs(v),$('sL').value==='DERECHA');le=Math.abs(lr-ld)<1e-9?'OK':'CORREGIDO'}
 }catch(e){msg.textContent='Escribe la corrección real como número (ej. 23,5).';return}
 const n=new Date(),z=x=>String(x).padStart(2,'0');
 const f={fecha_hora:n.getFullYear()+'-'+z(n.getMonth()+1)+'-'+z(n.getDate())+' '+z(n.getHours())+':'+z(n.getMinutes())+':'+z(n.getSeconds()),
 distancia_yd:fmt(U.dyd,1),vel_salida_fps:fmt(c.mv,0),cero_yd:fmt(c.cero,0),altura_mira_cm:fmt(c.sh,2),click_moa:fmt(c.clic,3),altitud_m:fmt(c.alt,0),temp_c:fmt(c.temp,1),
 presion_hpa_usada:fmt(U.p,1),origen_presion:c.pres?'medida':'estimada de altitud',humedad_pct:fmt(c.hr,0),densidad_kg_m3:fmt(U.rho,4),
 viento_media_kmh:fmt(c.viento,1),viento_peak_kmh:fmt(c.peak,1),viento_usado:uso,viento_usado_kmh:fmt(vk,1),viento_desde_deg:fmt(c.dir,0),giro_canon:c.giro,factor_viento:fmt(c.fv,2),
 'elev_pred_moa(+arriba)':fmt(ep,3),'elev_pred_dial_moa(+arriba)':fmt(ed,2),'elev_real_moa(+arriba)':fmt(er,2),elev_estado:ee,
 'lat_pred_moa(+derecha)':fmt(lp,3),'lat_pred_dial_moa(+derecha)':fmt(ld,2),'lat_real_moa(+derecha)':fmt(lr,2),lat_estado:le,
 notas:$('notas').value.replace(/[;\n\r]/g,' ').trim()};
 REG.push(f);if(!ls.set('slug217_registro',REG)){REG.pop();msg.textContent='No pude guardar en el teléfono. Exporta el CSV y libera espacio.';return}
 $('notas').value='';for(const w of['E','L']){$('ok'+w).checked=true;$('r'+w).classList.remove('on')}
 msg.textContent='Tiro #'+REG.length+' guardado · caída '+ee+' · lateral '+le+'. Exporta el CSV al terminar.';cnt()}
function cnt(){$('bReg').textContent='Registro ('+REG.length+')'}
function csv(){return'\ufeff'+COLS.join(';')+'\n'+REG.map(f=>COLS.map(k=>f[k]??'').join(';')).join('\n')+'\n'}
async function exportar(){if(!REG.length){$('msg').textContent='Aún no hay tiros guardados.';return}
 const d=new Date().toISOString().slice(0,10),file=new File([csv()],'registro_tiros_'+d+'.csv',{type:'text/csv'});
 try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove()}
function importar(txt){const L=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(x=>x.trim());if(L.length<2)return 0;const h=L[0].split(';');let n=0;
 const have=new Set(REG.map(f=>f.fecha_hora+f.distancia_yd));
 for(const l of L.slice(1)){const v=l.split(';'),f={};h.forEach((k,i)=>f[k]=v[i]??'');if(!f.fecha_hora||have.has(f.fecha_hora+f.distancia_yd))continue;REG.push(f);have.add(f.fecha_hora+f.distancia_yd);n++}
 REG.sort((a,b)=>a.fecha_hora<b.fecha_hora?-1:1);ls.set('slug217_registro',REG);cnt();return n}
function cerrar(){document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))}
function tabla(){if(!U){$('msg').textContent='Completa datos válidos primero.';return}const c=U.c,T=trays(c,c.viento);
